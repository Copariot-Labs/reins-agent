name: Build Reins for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out Reins
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.13.1"
          run_install: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install Rust target
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Build the Reins setup executable
        shell: pwsh
        run: ./scripts/build-windows-desktop.ps1

      - name: Sign installer when a certificate is configured
        id: signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_PFX_BASE64) {
            "signed=false" >> $env:GITHUB_OUTPUT
            Write-Host "No Windows signing certificate configured; publishing an unsigned test build."
            exit 0
          }

          $certificate = Join-Path $env:RUNNER_TEMP "reins-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64)
          )
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
              Where-Object FullName -Match '\\x64\\signtool\.exe$' |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe was not found" }
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
              /f $certificate /p $env:WINDOWS_SIGNING_PFX_PASSWORD release\Reins-Setup-x64.exe
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed" }
            "signed=true" >> $env:GITHUB_OUTPUT
          }
          finally {
            Remove-Item -Force $certificate -ErrorAction SilentlyContinue
          }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash release\Reins-Setup-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Reins-Setup-x64.exe" | Set-Content release\Reins-Setup-x64.exe.sha256 -Encoding ascii

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: Reins-Windows-x64
          path: |
            release/Reins-Setup-x64.exe
            release/Reins-Setup-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged installer to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repository = $env:GITHUB_REPOSITORY
          $installer = "release\Reins-Setup-x64.exe"
          $checksum = "release\Reins-Setup-x64.exe.sha256"
          $releases = gh release list --repo $repository --limit 100 --json tagName | ConvertFrom-Json
          $releaseExists = $null -ne ($releases | Where-Object { $_.tagName -eq $tag })

          if ($releaseExists) {
            gh release upload $tag $installer $checksum --repo $repository --clobber
          }
          else {
            $version = $tag -replace '^desktop-v', ''
            $arguments = @(
              "release", "create", $tag, $installer, $checksum,
              "--repo", $repository,
              "--verify-tag",
              "--title", "Reins Desktop $version",
              "--generate-notes"
            )
            if ($tag -match '(?i)-(alpha|beta|rc)([.-]|$)' -or "${{ steps.signing.outputs.signed }}" -ne "true") {
              $arguments += "--prerelease"
            }
            & gh @arguments
          }

          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publishing failed" }
