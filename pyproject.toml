[project]
name = "reins"
version = "0.1.0"
description = "A local-first personal agent powered by an upstream agent runtime"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "playwright>=1.49",
    "pillow>=10.0",
    "pytesseract>=0.3",
    "PyYAML>=6.0.1",
]

[project.scripts]
reins = "reins.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
